<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebStrides LLC</title>
  <meta name="description" content="WebStrides LLC builds tools that make learning languages easier, including FluentStrides.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Values copied from the FluentStrides tokens (palette.ts, primitives.ts)
       so the company and its first product read as one family. */
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E6EE;
      --text: #171B22;
      --muted: #585F6D;
      --brand: #2C6CEC;
      --brand-ink: #235BC9;
      --brand-soft: #ECF3FF;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1117;
        --surface: #171B22;
        --border: #2A2F3A;
        --text: #F0F2F7;
        --muted: #A4ABBA;
        --brand: #5189FA;
        --brand-ink: #82ABFF;
        --brand-soft: #162D5B;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding: 0 16px;
    }
    @media (min-width: 640px) { .wrap { padding: 0 24px; } }

    header { padding: 24px 0; }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
    }
    .wordmark img { width: 32px; height: 32px; }

    main { flex: 1; }
    .hero { padding: 48px 0 40px; }
    h1, h2 {
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.4px;
      margin: 0;
    }
    h1 { font-size: 48px; }
    @media (min-width: 640px) { h1 { font-size: 64px; } }
    .lead {
      margin: 16px 0 0;
      font-size: 18px;
      color: var(--muted);
      max-width: 36em;
    }
    @media (min-width: 640px) { .lead { font-size: 22px; } }

    section { padding: 24px 0; }
    h2 {
      font-size: 14px;
      font-family: 'Nunito Sans', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      color: inherit;
      text-decoration: none;
      transition: border-color 140ms cubic-bezier(0.2, 0, 0, 1), transform 140ms cubic-bezier(0.2, 0, 0, 1);
    }
    @media (min-width: 640px) { .product { padding: 24px; gap: 24px; } }
    .product:hover { border-color: var(--brand); }
    @media (prefers-reduced-motion: no-preference) {
      .product:hover { transform: translateY(-2px); }
    }
    .product:focus-visible, a:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }
    .product img {
      flex: none;
      width: 56px;
      height: 56px;
      padding: 8px;
      background: var(--brand-soft);
      border-radius: 16px;
    }
    .product-name {
      display: block;
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      line-height: 1.25;
    }
    .product-desc { display: block; color: var(--muted); }
    .product-link {
      display: block;
      margin-top: 4px;
      font-weight: 700;
      color: var(--brand-ink);
    }

    .contact a {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand-ink);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .contact a:hover { text-decoration: underline; }

    footer {
      margin-top: 48px;
      padding: 24px 0 32px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="wordmark" href="/"><img src="favicon.svg" alt="">WebStrides</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="hero">
        <h1>WebStrides LLC</h1>
        <p class="lead">WebStrides builds tools that make learning languages easier.</p>
      </div>

      <section aria-labelledby="products">
        <h2 id="products">Products</h2>
        <a class="product" href="https://fluentstrides.app">
          <img src="assets/fluentstrides.png" alt="" width="56" height="56">
          <span>
            <span class="product-name">FluentStrides</span>
            <span class="product-desc">Watch real videos at exactly your level and pick up a language by understanding people talk.</span>
            <span class="product-link">fluentstrides.app &rarr;</span>
          </span>
        </a>
      </section>

      <section class="contact" aria-labelledby="contact">
        <h2 id="contact">Contact</h2>
        <a href="mailto:hello@webstrides.com">hello@webstrides.com</a>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">&copy; 2026 WebStrides LLC &middot; Wyoming, USA</div>
  </footer>
</body>
</html>
